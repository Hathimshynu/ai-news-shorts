name: Daily report and dashboard

on:
  schedule:
    - cron: "45 16 * * *"   # 16:45 UTC = 10:15 PM IST, after the evening posting window
  workflow_dispatch: {}

permissions:
  contents: write   # save analytics and the dashboard page

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-api-python-client google-auth
      - name: Collect analytics
        run: python -m pipeline.analytics
        continue-on-error: true
      - name: Send daily report
        run: python -m pipeline.report
      - name: Build dashboard
        run: python -m pipeline.dashboard
      - name: Save
        run: |
          git config user.name "ai-news-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/analytics.json docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily analytics and dashboard"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
