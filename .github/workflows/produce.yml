name: Produce daily short

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST  (morning video)
    - cron: "30 9 * * *"   # 09:30 UTC = 3:00 PM IST  (evening video)
    # GitHub may start scheduled runs 5-30 min late
  workflow_dispatch: {}

permissions:
  contents: write   # to commit data/used_topics.json

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional overrides from Settings > Secrets and variables > Actions > Variables
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      AFFILIATE_FOOTER: ${{ vars.AFFILIATE_FOOTER }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      TTS_RATE: ${{ vars.TTS_RATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'base' }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: renderer/node_modules
          key: node-${{ hashFiles('renderer/package.json') }}

      - name: Install renderer
        working-directory: renderer
        run: npm install --no-audit --no-fund

      - name: Produce video
        run: python -m pipeline.produce

      - name: Save video for the publish workflow
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            out/final.mp4
            out/thumb_yt.jpg
            out/thumb_vertical.jpg
            out/meta.json
          retention-days: 3

      - name: Commit used topics
        if: success()
        continue-on-error: true   # never mark the run failed just because this small save failed
        run: |
          git config user.name "ai-news-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/used_topics.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record today's topic"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
