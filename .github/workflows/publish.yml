name: Publish approved short

# Public repo (recommended): starts right after each video is made and keeps watching Telegram
# until the video is posted or decided (latest 11 PM IST). Every tap is confirmed within ~10 s.
# Approved videos post at 8 PM (first video) / 9 PM (second); "Post now" posts immediately.
# Private repo: falls back to one quick check per schedule (saves Actions minutes).
on:
  workflow_run:
    workflows: ["Produce daily short"]
    types: [completed]
  schedule:
    # Backups only (GitHub often runs schedules hours late, so they are not relied on)
    - cron: "30 14 * * *"     # 8:00 PM IST
    - cron: "30 15 * * *"     # 9:00 PM IST
    - cron: "30 16 * * *"     # 10:00 PM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "manual = post an approved video now. watch = keep watching Telegram."
        required: false
        default: manual
        type: choice
        options: [manual, watch]

permissions:
  actions: write    # download videos, and start a new video when you pick a topic
  contents: write   # remember which videos were posted (data/published.json)

concurrency:
  group: publish
  cancel-in-progress: false   # never interrupt a post; extra runs wait their turn

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      AFFILIATE_FOOTER: ${{ vars.AFFILIATE_FOOTER }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'manual')
        || (github.event.repository.private && 'check')
        || 'watch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest records, on a real branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q requests google-api-python-client google-auth

      - name: Download videos from the last 24 hours
        run: bash scripts/fetch_videos.sh

      - name: Check approvals (watch mode posts by itself)
        id: gate
        run: python -m pipeline.gate

      - name: Publish
        if: steps.gate.outputs.action == 'publish'
        run: python -m pipeline.publish

      - name: Save posted/skipped record
        if: always()
        run: bash scripts/save_record.sh
