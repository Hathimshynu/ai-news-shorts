const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (n ?? 0).toLocaleString("en-IN");
document.getElementById("updated").textContent =
  "Updated " + new Date(DATA.generated).toLocaleString("en-IN", {timeZone: "Asia/Kolkata"}) + " IST · read-only (approve videos in Telegram)";

const stats = DATA.analytics || {}, records = DATA.published || {};
const weekAgo = Date.now() - 7 * 864e5;
const tot = {views: 0, likes: 0, comments: 0, posts: 0};
for (const [id, e] of Object.entries(stats)) {
  if (new Date(id.slice(0, 10)) < weekAgo) continue;
  tot.posts++;
  for (const m of Object.values(e.platforms || {})) { tot.views += m.views || 0; tot.likes += m.likes || 0; tot.comments += m.comments || 0; }
}
const er = tot.views ? (100 * (tot.likes + tot.comments) / tot.views).toFixed(2) + "%" : "–";
document.getElementById("kpis").innerHTML = [["Videos posted", tot.posts], ["Views", num(tot.views)], ["Likes", num(tot.likes)],
  ["Comments", num(tot.comments)], ["Engagement rate", er]].map(([k, v]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");

const t = DATA.trends || {};
document.getElementById("trends").innerHTML = t.candidates ? `<p class="reason"><b>Picked:</b> ${esc(t.chosen)}<br><span class="muted">${esc(t.reason)}</span></p>
  <div class="table-wrap"><table><tr><th>Score</th><th>Story</th><th>Sources</th></tr>${t.candidates.map(c =>
  `<tr><td>${c.score}</td><td>${c.links && c.links[0] ? `<a href="${esc(c.links[0])}" target="_blank" rel="noopener">${esc(c.title)}</a>` : esc(c.title)}${c.primary ? ' <span class="pill published">official</span>' : ""}</td><td class="muted">${esc((c.kinds || []).join(", "))}</td></tr>`).join("")}</table></div>`
  : '<p class="muted">No trend snapshot yet.</p>';

const cats = {};
for (const e of Object.values(stats)) {
  const c = (e.info || {}).category || "Uncategorised";
  const v = Object.values(e.platforms || {}).reduce((s, m) => s + (m.views || 0), 0);
  (cats[c] = cats[c] || []).push(v);
}
const catRows = Object.entries(cats).map(([c, v]) => [c, v.reduce((a, b) => a + b, 0) / v.length]).sort((a, b) => b[1] - a[1]);
const maxCat = Math.max(1, ...catRows.map(r => r[1]));
document.getElementById("cats").innerHTML = catRows.length ? catRows.map(([c, v]) =>
  `<div class="bar-row"><span>${esc(c)}</span><div class="bar" style="width:${Math.max(2, 100 * v / maxCat)}%"></div><span>${num(Math.round(v))}</span></div>`).join("")
  : '<p class="muted">Appears after the first videos get views.</p>';

const ids = Object.keys(records).sort().reverse();
document.getElementById("library").innerHTML = `<tr><th>Video</th><th>Status</th><th>Category</th><th>Links</th><th>Views</th><th>Likes</th><th>ER</th></tr>` +
  ids.map(id => {
    const r = typeof records[id] === "string" ? {status: records[id]} : records[id];
    const e = stats[id] || {}, info = r.info || e.info || {};
    const p = Object.values(e.platforms || {});
    const views = p.reduce((s, m) => s + (m.views || 0), 0), likes = p.reduce((s, m) => s + (m.likes || 0), 0),
      inter = p.reduce((s, m) => s + (m.likes || 0) + (m.comments || 0) + (m.shares || 0) + (m.saves || 0), 0);
    const links = Object.entries(r.platforms || {}).map(([k, v]) => `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(" · ");
    return `<tr><td><b>${esc(info.title || id)}</b><br><span class="muted">${esc(id)}</span></td>
      <td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td><td>${esc(info.category || "")}</td>
      <td>${links || "–"}</td><td>${num(views)}</td><td>${num(likes)}</td><td>${views ? (100 * inter / views).toFixed(1) + "%" : "–"}</td></tr>`;
  }).join("");

const issues = ids.filter(id => ["failed", "posting"].includes((records[id] || {}).status));
document.getElementById("issues").innerHTML = issues.length ? issues.map(id => `<p>⚠️ ${esc(id)}: ${esc(records[id].status)}</p>`).join("")
  : '<p class="muted">Nothing needs attention.</p>';
</script>
